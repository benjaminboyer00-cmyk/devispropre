name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devispropre
          POSTGRES_PASSWORD: devispropre
          POSTGRES_DB: devispropre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devispropre"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://devispropre:devispropre@localhost:5432/devispropre?schema=public
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run test

      - run: npm run build

      - run: npm run lint

  # Déploiement VPS après succès des tests sur main. Inactif tant que les secrets
  # VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_KNOWN_HOSTS ne sont pas configurés.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "Secrets VPS absents — déploiement ignoré (voir docs/DEPLOY-CI.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déployer via SSH (commande forcée côté serveur)
        if: steps.cfg.outputs.enabled == 'true'
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Empreinte du serveur épinglée : jamais StrictHostKeyChecking=no.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" deploy

