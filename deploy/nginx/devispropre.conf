# Nginx reverse proxy — /etc/nginx/sites-available/devispropre
# sudo ln -s /etc/nginx/sites-available/devispropre /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# Les directives `map` ci-dessous doivent être dans le bloc http {} (nginx.conf ou include).

map $request_uri $dp_log_uri {
    ~^/devis/[a-f0-9]{64}                 /devis/[REDACTED];
    ~^/facture/[a-f0-9]{64}               /facture/[REDACTED];
    ~^/api/public/devis/[a-f0-9]{64}      /api/public/devis/[REDACTED];
    ~^/api/public/factures/[a-f0-9]{64}   /api/public/factures/[REDACTED];
    ~^/api/auth/magic-link/verify         /api/auth/magic-link/verify?token=[REDACTED];
    default                               $request_uri;
}

log_format dp_sanitized '$remote_addr - $remote_user [$time_local] '
    '"$request_method $dp_log_uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=dp_general:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=dp_seo:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dp_api_auth:10m rate=5r/s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

upstream devispropre_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name devispropre.fr www.devispropre.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://devispropre.fr$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devispropre.fr www.devispropre.fr;

    # Certbot : ssl_certificate /etc/letsencrypt/live/devispropre.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/devispropre.fr/privkey.pem;

    # Canonical : www → apex
    if ($host = www.devispropre.fr) {
        return 301 https://devispropre.fr$request_uri;
    }

    client_max_body_size 10m;

    access_log /var/log/nginx/devispropre.access.log dp_sanitized;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets Next.js — cache long, sans solliciter Node inutilement
    location /_next/static/ {
        proxy_pass http://devispropre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Service Worker — jamais en cache immutable (PWA)
    location = /sw.js {
        proxy_pass http://devispropre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        proxy_pass http://devispropre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SEO local — rate limit anti crawl agressif
    location ~ ^/devis-artisan/ {
        limit_req zone=dp_seo burst=20 nodelay;
        proxy_pass http://devispropre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Auth / cron — blocage couche 7 avant Node.js
    location ~ ^/api/(auth|cron)/ {
        limit_req zone=dp_api_auth burst=10 nodelay;
        proxy_pass http://devispropre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=dp_general burst=40 nodelay;
        proxy_pass http://devispropre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}
