# Nginx reverse proxy — /etc/nginx/sites-available/devispropre
# sudo ln -s /etc/nginx/sites-available/devispropre /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=dp_general:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=dp_seo:10m rate=5r/s;

upstream devispropre_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name devispropre.fr www.devispropre.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://devispropre.fr$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devispropre.fr www.devispropre.fr;

    # Certbot : ssl_certificate /etc/letsencrypt/live/devispropre.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/devispropre.fr/privkey.pem;

    client_max_body_size 10m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets Next.js — cache long, sans solliciter Node inutilement
    location /_next/static/ {
        proxy_pass http://devispropre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        proxy_pass http://devispropre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SEO local — rate limit anti crawl agressif
    location ~ ^/devis-artisan/ {
        limit_req zone=dp_seo burst=20 nodelay;
        proxy_pass http://devispropre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=dp_general burst=40 nodelay;
        proxy_pass http://devispropre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}
